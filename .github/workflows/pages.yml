name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout verified content catalog
        uses: actions/checkout@v4
        with:
          repository: chizyo43-debug/alika-icerik
          ref: 628c2ac3dffa2570aa95a23a2ec1a0f7dfedb840
          path: _content
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install site dependencies
        run: npm ci
      # İçerik deposunun kendi kalite kapısı: ders/LGS paketleri, ilkokul görsel paketleri ve KATALOG.json.
      - name: Validate source content packages
        run: python _content/dogrulayici/kontrol.py
      - name: Build
        run: python tools/build.py
      - name: Build home page
        run: npm run build:home
      - name: Type check home page
        run: npm run typecheck
      - name: Validate
        run: python tools/check.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
