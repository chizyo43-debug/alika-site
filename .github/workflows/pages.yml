name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout verified content catalog
        uses: actions/checkout@v4
        with:
          repository: chizyo43-debug/alika-icerik
          ref: 46dd1bf3cbbf626d3cd75c9c23c2afffcf077fa5
          path: _content
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install book experience dependencies
        run: npm ci
      - name: Verify assistant knowledge freshness
        run: npm run knowledge:verify
      - name: Validate source content packages
        shell: bash
        run: |
          for file in _content/turkiye/*/*/*.jsonl; do
            python _content/tools/pack_validate.py --strict "$file"
          done
      - name: Build
        run: python tools/build.py
      - name: Build interactive book homepage
        run: npm run build:book
        env:
          ALIKA_ASSISTANT_ENDPOINT: ${{ vars.ALIKA_ASSISTANT_ENDPOINT }}
      - name: Type check interactive book
        run: npm run typecheck
      - name: Validate
        run: python tools/check.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
